<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Consolas, monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#120B04"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FF8C1A"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="url(#bg2)"/>
  <text x="490" y="32" text-anchor="middle" fill="#FF8C1A" font-size="18" font-weight="bold">J.A.R.V.I.S V2 · ARCHITECTURE OVERVIEW</text>

  <!-- Interfaces layer -->
  <rect x="30" y="55" width="920" height="72" rx="10" fill="#141414" stroke="#FF8C1A" stroke-width="1.5"/>
  <text x="52" y="80" fill="#FFB25E" font-size="12" font-weight="bold">INTERFACES</text>
  <text x="250" y="106" text-anchor="middle" fill="#F5EDE0" font-size="12">gui/main_window.py · Solar Core HUD (Tkinter)</text>
  <text x="620" y="106" text-anchor="middle" fill="#F5EDE0" font-size="12">main.py --voice-only · pure voice loop</text>
  <text x="860" y="106" text-anchor="middle" fill="#F5EDE0" font-size="12">main.py --command · one-shot CLI</text>

  <!-- Core layer -->
  <rect x="30" y="160" width="920" height="86" rx="10" fill="#141414" stroke="#FF8C1A" stroke-width="1.5"/>
  <text x="52" y="185" fill="#FFB25E" font-size="12" font-weight="bold">CORE</text>
  <text x="200" y="215" text-anchor="middle" fill="#F5EDE0" font-size="12">core/jarvis.py</text>
  <text x="200" y="234" text-anchor="middle" fill="#9A8F7F" font-size="10">orchestrator + routing</text>
  <text x="450" y="215" text-anchor="middle" fill="#F5EDE0" font-size="12">core/config_manager.py</text>
  <text x="450" y="234" text-anchor="middle" fill="#9A8F7F" font-size="10">JSON config + .env loader</text>
  <text x="680" y="215" text-anchor="middle" fill="#F5EDE0" font-size="12">personality/response_generator.py</text>
  <text x="680" y="234" text-anchor="middle" fill="#9A8F7F" font-size="10">Groq AI + offline persona</text>
  <text x="880" y="215" text-anchor="middle" fill="#F5EDE0" font-size="12">voice/*</text>
  <text x="880" y="234" text-anchor="middle" fill="#9A8F7F" font-size="10">STT · TTS · profiles</text>

  <!-- Modules layer -->
  <rect x="30" y="278" width="920" height="96" rx="10" fill="#141414" stroke="#FF8C1A" stroke-width="1.5"/>
  <text x="52" y="302" fill="#FFB25E" font-size="12" font-weight="bold">MODULES (19)</text>
  <g fill="#F5EDE0" font-size="11" text-anchor="middle">
    <text x="130" y="330">system</text>
    <text x="220" y="330">application</text>
    <text x="310" y="330">window</text>
    <text x="400" y="330">file</text>
    <text x="490" y="330">web</text>
    <text x="580" y="330">screenshot</text>
    <text x="670" y="330">productivity</text>
    <text x="760" y="330">memory</text>
    <text x="860" y="330">roblox (safe)</text>
    <text x="130" y="356">email</text>
    <text x="220" y="356">whatsapp</text>
    <text x="310" y="356">phone</text>
    <text x="400" y="356">spotify + local</text>
    <text x="510" y="356">calendar</text>
    <text x="600" y="356">zoom</text>
    <text x="690" y="356">word</text>
    <text x="780" y="356">social</text>
    <text x="870" y="356">smart home · WoL</text>
  </g>

  <!-- Storage layer -->
  <rect x="30" y="406" width="440" height="50" rx="10" fill="#141414" stroke="#38E07C" stroke-width="1.5"/>
  <text x="52" y="428" fill="#38E07C" font-size="12" font-weight="bold">LOCAL STORAGE</text>
  <text x="250" y="446" text-anchor="middle" fill="#F5EDE0" font-size="11">SQLite memory · JSON stores · logs · screenshots</text>

  <!-- External layer -->
  <rect x="510" y="406" width="440" height="50" rx="10" fill="#141414" stroke="#B4530A" stroke-width="1.5"/>
  <text x="532" y="428" fill="#FFB25E" font-size="12" font-weight="bold">EXTERNAL (optional, via .env)</text>
  <text x="730" y="446" text-anchor="middle" fill="#F5EDE0" font-size="11">Groq · SMTP/IMAP · Twilio · Spotify · Home Assistant · WoL</text>

  <!-- arrows -->
  <line x1="490" y1="127" x2="490" y2="156" stroke="#FF8C1A" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="490" y1="246" x2="490" y2="274" stroke="#FF8C1A" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="250" y1="374" x2="250" y2="402" stroke="#38E07C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <line x1="730" y1="374" x2="730" y2="402" stroke="#B4530A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
</svg>
