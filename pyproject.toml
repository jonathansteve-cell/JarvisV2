[project]
name = "jarvis-v2"
version = "2.0.0"
description = "All-in-one desktop AI assistant inspired by J.A.R.V.I.S."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "jonathansteve-cell"}]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
